# 与官方 docker-compose.yml 一起使用（放在同一目录，compose 会自动合并同名 override）：
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
# 所有值都从同目录的 .env 读取（模板见 deploy/secrets.env.example），文件里不出现任何真实密钥。
services:

  functions:
    environment:
      # 邮件服务就是本 compose 里的 mail-relay 容器；换外部 HTTP 邮件 API 时把 URL 改成对方地址即可。
      EMAIL_API_URL: ${EMAIL_API_URL:-http://mail-relay:8080/send}
      EMAIL_API_KEY: ${EMAIL_RELAY_TOKEN}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_URL: ${APP_URL}
      CRON_SECRET: ${CRON_SECRET}
      # 自托管可以把一轮消费预算调大（毫秒，30 秒–15 分钟；不设时用代码里的默认 110 秒，
      # 那是为托管免费方案 150 秒墙钟留的余量）。必须小于 cron 侧的 STABX_NOTIFY_TIMEOUT。
      NOTIFY_MAX_RUNTIME_MS: ${NOTIFY_MAX_RUNTIME_MS:-240000}
      # 自托管必须设置：签名文件地址要换成浏览器可达的公网地址（否则返回 http://api-gw:8000/…）。
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
    depends_on:
      - mail-relay

  mail-relay:
    build: ./mail-relay
    container_name: stabx-mail-relay
    restart: unless-stopped
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      RELAY_TOKEN: ${EMAIL_RELAY_TOKEN}
      RELAY_RATE_PER_MINUTE: ${RELAY_RATE_PER_MINUTE:-12}
    # 只在容器网络内可达：这里故意不写 ports:，任何情况下都不向公网发布 8080。
    expose:
      - "8080"

  db:
    # 数据库不对外暴露，只允许容器网络内访问（安全组里也请不要放行 5432/6543）。
    ports: !reset []

  supavisor:
    ports: !reset []
